[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-agent-bot"
version = "2.0.0"
description = "Public relations outreach bot for pitching products to journalists"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Interaction Company of California"}]

[tool.setuptools]
packages = ["app"]
